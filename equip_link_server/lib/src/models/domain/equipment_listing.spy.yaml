class: EquipmentListing
table: equipment_listing
fields:
  ownerId: UuidValue
  categoryId: int
  title: String
  description: String
  hourlyRate: double?
  dailyRate: double
  securityDeposit: double
  condition: String
  status: String
  locationCampus: String
  imageUrls: List<String>
  createdAt: DateTime
  updatedAt: DateTime
indexes:
  equipment_listing_owner_idx:
    fields: ownerId
  equipment_listing_category_idx:
    fields: categoryId
  equipment_listing_status_idx:
    fields: status
